<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>2026 蔵王の集い（終了しました）</title>
<style>
  :root { --green: #2f4a3a; --bg: #f7f4ee; --text: #222; --muted: #666; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px; text-align: center; }
  h1 { color: var(--green); font-size: 26px; margin: 0 0 24px; }
  p { font-size: 18px; line-height: 1.8; margin: 0 0 16px; }
  .small { font-size: 15px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>2026 蔵王の集い</h1>
  <p>ご参加ありがとうございました。<br>参加者向けサイトの公開は終了しました。</p>
  <p class="small">この端末に保存されていた参加者情報は削除しました。</p>
</main>
<script>
  // 公開中に端末へ保存した合言葉・参加者データを削除する
  try { localStorage.clear(); } catch (e) {}
  try { sessionStorage.clear(); } catch (e) {}
</script>
</body>
</html>
